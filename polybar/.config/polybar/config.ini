;;;;;;;;;;;;;;
;; Power Off ;;
;;;;;;;;;;;;;;;
[module/poweroff]
type = custom/script
exec = echo " "
click-left = systemctl poweroff
click-right = i3lock-fancy -pg &
click-middle = systemctl restart

[module/gpu-status]
type = custom/script
exec = /usr/local/bin/gpu-status.sh
interval = 10
label = %output%
label-foreground = ${colors.green}

[module/pomodoro]
type = custom/script
exec = ~/.config/polybar/pomodoro/wrapper.sh
interval = 1
label = %output%
tail = true

[settings]
screenchange-reload = true
pseudo-transparency = true

[module/spotify]
type = custom/script
exec = ~/.config/polybar/script/scroll_spotify_status.sh
label =  %output%
tail = true
format = <label>
label-foreground= ${colors.lavender}
label-padding-left=1

; vim:ft=dosini
