# SDDM Theme Configuration
# Managed by dotfiles theme system
#
# This configuration:
# - Disables auto-login (requires manual login)
# - Sets Catppuccin theme matching system theme
# - Can be updated when switching themes

[Autologin]
# Auto-login disabled - show login screen
Relogin=false
Session=
User=

[Theme]
# Catppuccin theme matching system theme
# Theme name format: catppuccin-<flavor>-<accent>
# Flavors: mocha, latte, frappe, macchiato
# Accents: mauve (default), blue, pink, lavender, etc.
Current=catppuccin-macchiato-mauve

# Enable user avatars
EnableAvatars=true
FacesDir=/usr/share/sddm/faces

# Theme directory
ThemeDir=/usr/share/sddm/themes
