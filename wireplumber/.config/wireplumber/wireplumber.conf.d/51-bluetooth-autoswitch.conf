# Automatically switch to Bluetooth audio devices when connected
# WirePlumber 0.5+ configuration format
#
# Strategy: "Last connected wins"
# Bluetooth devices get priority 1800, same as USB devices.
# When multiple devices have the same priority, the most recently connected becomes default.

monitor.bluez.properties = {
  # Auto-connect to Bluetooth devices
  bluez5.roles = [ a2dp_sink a2dp_source ]
  bluez5.hfphsp-backend = "native"
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
}

# Set priority for Bluetooth nodes directly in bluez monitor
monitor.bluez.rules = [
  {
    matches = [
      {
        # Match Bluetooth audio output nodes
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        # Same priority as USB - last connected wins
        priority.driver = 1800
        priority.session = 1800
        node.pause-on-idle = false
      }
    }
  }
  {
    matches = [
      {
        # Match Bluetooth card devices
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        # Use A2DP profile by default (high quality)
        bluez5.auto-connect = [ a2dp_sink ]
        # Same priority as USB - last connected wins
        priority.driver = 1800
        priority.session = 1800
      }
    }
  }
]
