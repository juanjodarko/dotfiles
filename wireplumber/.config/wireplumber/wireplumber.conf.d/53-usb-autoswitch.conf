# Automatically switch to USB audio devices when connected
# WirePlumber 0.5+ configuration format
#
# Strategy: "Last connected wins"
# All USB devices get the same priority (1800), higher than built-in audio.
# When multiple devices have the same priority, the most recently connected becomes default.

# Set priorities for USB audio output nodes
monitor.alsa.rules = [
  {
    matches = [
      {
        # Match all USB audio outputs
        node.name = "~alsa_output\\.usb-.*"
      }
    ]
    actions = {
      update-props = {
        # Same priority as Bluetooth - last connected wins
        priority.driver = 1800
        priority.session = 1800
        node.pause-on-idle = false
      }
    }
  }
  {
    matches = [
      {
        # Match all USB audio inputs
        node.name = "~alsa_input\\.usb-.*"
      }
    ]
    actions = {
      update-props = {
        # Same priority as Bluetooth - last connected wins
        priority.driver = 1800
        priority.session = 1800
        node.pause-on-idle = false
      }
    }
  }
]

# Priority ordering (for auto-switching):
# - USB devices: 1800 (last connected wins)
# - Bluetooth devices: 1800 (from 51-bluetooth-autoswitch.conf)
# - Built-in audio: default (100-1500, fallback when nothing else connected)
#
# Behavior:
# - Plug in USB headset → becomes default
# - Connect Bluetooth → becomes default
# - Unplug/disconnect current device → switches to next available external device
# - No external devices → uses built-in audio
