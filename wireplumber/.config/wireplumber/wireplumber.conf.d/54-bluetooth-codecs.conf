# Enhanced Bluetooth codec configuration for high-quality audio
# WirePlumber 0.5+ configuration format
#
# This configuration enables high-quality Bluetooth audio codecs
# for the best possible wireless audio experience.
#
# Codec Priority (highest to lowest):
# 1. LDAC (990 kbps) - Sony's high-res codec
# 2. aptX HD (576 kbps) - Qualcomm high-def
# 3. aptX (352 kbps) - Qualcomm standard
# 4. AAC (256 kbps) - Apple devices
# 5. SBC-XQ (328 kbps) - Enhanced SBC
# 6. SBC (328 kbps) - Universal fallback

# Enable high-quality Bluetooth codecs
monitor.bluez.properties = {
  # Enable all available codecs
  bluez5.codecs = [ ldac aptx_hd aptx aac sbc_xq sbc ]

  # LDAC codec (highest quality)
  bluez5.enable-ldac = true

  # aptX codecs
  bluez5.enable-aptx = true
  bluez5.enable-aptx-hd = true

  # AAC codec (for Apple devices)
  bluez5.enable-aac = true

  # Enhanced SBC
  bluez5.enable-sbc-xq = true

  # Hardware volume control
  bluez5.enable-hw-volume = true

  # mSBC for better call quality
  bluez5.enable-msbc = true
}

# Note: WirePlumber will automatically select the best available codec
# based on device capabilities. No manual codec forcing needed.
#
# To verify active codec: pactl list cards | grep -A20 bluez
#
# Required packages:
# - libldac (LDAC codec)
# - libfreeaptx (aptX codec)
