# Default audio device selection policy
# WirePlumber 0.5+ configuration format
#
# Strategy: Auto-switch to newly connected devices

wireplumber.settings = {
  # Automatically switch to new audio devices
  node.features.audio = {
    auto-connect = true
  }
}

# Policy for default nodes - enable stream moving
wireplumber.profiles = {
  policy = {
    bluez5.auto-connect = [ hfp_hf hsp_hs a2dp_sink ]
    # Move existing streams to new default device
    move-session-streams = true
  }
}
