# Automatically set Bluetooth devices as default when they connect
# WirePlumber 0.5+ configuration format

wireplumber.settings = {
  # Automatically switch to new audio devices
  node.features.audio = {
    auto-connect = true
  }
}

# Policy for default nodes
wireplumber.profiles = {
  policy = {
    bluez5.auto-connect = [ hfp_hf hsp_hs a2dp_sink ]
    move-session-streams = false
  }
}
