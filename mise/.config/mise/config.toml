# mise (polyglot version manager) global configuration
# This file is tracked in dotfiles and symlinked to ~/.config/mise/config.toml

[tools]
# Default tool versions used globally unless overridden by project-specific config
node = "20.13.0"
python = "3.9.11"
# Ruby versions managed separately per project

[settings]
# Performance and behavior settings
experimental = true           # Enable experimental features
legacy_version_file = true    # Support .node-version, .ruby-version, etc.
always_keep_download = false  # Clean up downloads after installation
always_keep_install = true    # Keep installed versions
plugin_autoupdate_last_check_duration = "7d"  # Auto-update plugins weekly

# Verbose output for debugging (set to false once stable)
verbose = false
quiet = false
idiomatic_version_file_enable_tools = ["ruby"]

[env]
# Global environment variables
# Add project-specific env vars in project-level mise.toml files

# Example task configuration (can be overridden per project)
# [tasks.test]
# run = "npm test"
#
# [tasks.dev]
# run = "npm run dev"
