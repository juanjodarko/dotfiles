# yazi.toml — managed in dotfiles (stow package: yazi/)
#
# Theme is NOT set here. It comes from the central Catppuccin switcher:
#   ~/.config/yazi/theme.toml  →  ~/.config/themes/current.yazi  (symlink managed
#   by the theme switcher, swapped per flavor alongside kitty/ghostty/etc.)
#
# Openers below are wired to your existing apps (nvim, mpv, imv, evince via xdg-open,
# nautilus). Image previews use the kitty graphics protocol automatically when run
# inside kitty.

[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true

[preview]
image_filter  = "lanczos3"
image_quality = 90
max_width     = 1200
max_height    = 1200
wrap          = "no"
tab_size      = 2

[opener]
edit = [
  { run = 'nvim "$@"', block = true, desc = "Edit (nvim)", for = "unix" },
]
open = [
  { run = 'xdg-open "$@"', desc = "Open (default app)", for = "unix" },
]
play = [
  { run = 'mpv "$@"', orphan = true, desc = "Play (mpv)", for = "unix" },
]
view-image = [
  { run = 'imv "$@"', orphan = true, desc = "View (imv)", for = "unix" },
]
reveal = [
  { run = 'nautilus "$@"', orphan = true, desc = "Reveal in Files (Nautilus)", for = "unix" },
]

[open]
rules = [
  { name = "*/", use = [ "edit", "reveal", "open" ] },

  { mime = "text/*",              use = [ "edit", "reveal" ] },
  { mime = "image/*",             use = [ "view-image", "reveal", "open" ] },
  { mime = "{audio,video}/*",     use = [ "play", "reveal", "open" ] },
  { mime = "application/{,x-}pdf", use = [ "open", "reveal" ] },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*}", use = [ "open", "reveal" ] },

  { name = "*.md", use = [ "edit", "open" ] },

  # Fallback
  { mime = "*", use = [ "open", "reveal", "edit" ] },
]
