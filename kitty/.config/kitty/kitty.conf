# kitty.conf — managed in dotfiles (stow package: kitty/)
#
# Kept as the Hyprland $terminal (Mod+Return). Settings below preserve the
# previously-unmanaged ~/.config/kitty/kitty.conf verbatim; the ONE change is
# theming: instead of a static current-theme.conf pinned to Mocha, colours now
# come from the central Catppuccin theme switcher (frappe/latte/macchiato/mocha).

# ── Theme ──────────────────────────────────────────────────────────────────
# current.kitty is a symlink (managed by the theme switcher) →
#   ~/.config/themes/catppuccin/<flavor>.kitty
# Switch flavours with Alt+Space → Settings → Theme (or the wofi theme switcher);
# kitty live-reloads on SIGUSR1, which the switcher sends.
include ${HOME}/.config/themes/current.kitty

# ── Font ── (unchanged from your existing config)
font_family      SauceCodePro Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ── Window ── (unchanged from your existing config)
hide_window_decorations yes
background_opacity      0.9
background_blur         10

# ── Behaviour parity with ghostty ──────────────────────────────────────────
# shift+enter inserts a literal newline (ghostty: keybind = shift+enter=text:\n)
map shift+enter send_text all \n
