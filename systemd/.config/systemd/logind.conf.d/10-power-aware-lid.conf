[Login]
# Power-aware lid switch handling
# Makes lid behavior match the conditional suspend strategy

# When on battery power: suspend immediately when lid closes
# This conserves battery when laptop is closed and unplugged
HandleLidSwitch=suspend

# When on AC power (external power): only lock screen when lid closes
# This allows the laptop to continue running tasks when plugged in and closed
# Useful for downloads, builds, or when using external monitors
HandleLidSwitchExternalPower=lock

# When docked: ignore lid close
# Allows using laptop closed with external monitors in a docking station
HandleLidSwitchDocked=ignore
