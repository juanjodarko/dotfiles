config-version = 2

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse teleports to center only when switching monitors (cue without constant following)
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

automatically-unhide-macos-hidden-apps = false

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 10
    inner.vertical =   10
    outer.left =       10
    outer.bottom =     10
    outer.top =        10
    outer.right =      10

[mode.main.binding]
    # Layout
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # Focus within workspace
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # Move within workspace
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Focus monitor
    alt-ctrl-h = 'focus-monitor left'
    alt-ctrl-j = 'focus-monitor down'
    alt-ctrl-k = 'focus-monitor up'
    alt-ctrl-l = 'focus-monitor right'

    # Move window to monitor
    alt-ctrl-shift-h = 'move-node-to-monitor left'
    alt-ctrl-shift-j = 'move-node-to-monitor down'
    alt-ctrl-shift-k = 'move-node-to-monitor up'
    alt-ctrl-shift-l = 'move-node-to-monitor right'

    # Resize (quick one-shot)
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Balance all windows equally
    alt-0 = 'balance-sizes'

    # Fullscreen
    alt-shift-f = 'fullscreen'
    alt-ctrl-f = 'macos-native-fullscreen'

    # Workspaces
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    # Move window to workspace
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'

    # Workspace navigation
    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Modes
    alt-r = 'mode resize'
    alt-s = 'mode summon'
    alt-shift-semicolon = 'mode service'

# Resize mode: hold mode, tap hjkl repeatedly, 0 to balance, esc to exit
[mode.resize.binding]
    h = 'resize width -50'
    l = 'resize width +50'
    k = 'resize height -50'
    j = 'resize height +50'
    minus = 'resize smart -50'
    equal = 'resize smart +50'
    0 = ['balance-sizes', 'mode main']
    esc = 'mode main'

# Summon mode: pull a workspace from another monitor to the current one
[mode.summon.binding]
    1 = ['summon-workspace 1', 'mode main']
    2 = ['summon-workspace 2', 'mode main']
    3 = ['summon-workspace 3', 'mode main']
    4 = ['summon-workspace 4', 'mode main']
    5 = ['summon-workspace 5', 'mode main']
    6 = ['summon-workspace 6', 'mode main']
    7 = ['summon-workspace 7', 'mode main']
    8 = ['summon-workspace 8', 'mode main']
    9 = ['summon-workspace 9', 'mode main']
    esc = 'mode main'

# Service mode: infrequent layout surgery
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    # Swap window with neighbor
    h = ['swap left', 'mode main']
    j = ['swap down', 'mode main']
    k = ['swap up', 'mode main']
    l = ['swap right', 'mode main']

    # Join windows into a container
    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

[workspace-to-monitor-force-assignment]
    1 = 1
    2 = 1
    3 = 1
    4 = [2, 1]
    5 = [2, 1]
    6 = [2, 1]
    7 = [3, 2, 1]
    8 = [3, 2, 1]
    9 = [3, 2, 1]
