# Monitor configuration for Hyprland
# Managed by nwg-displays - use nwg-displays GUI to modify

# Default fallback for unknown monitors
monitor=,preferred,auto,auto

# Virtual monitor (for VMs/remote desktop)
monitor=Virtual-1,preferred,auto,1

# Primary laptop display (left side, origin point)
monitor=eDP-1,preferred,0x0,1

# External display (right side, offset by laptop width)
monitor=DP-1,preferred,1920x0,1
