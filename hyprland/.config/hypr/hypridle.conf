general {
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hyprctl dispatch dpms on
}

# Dim screen after 10 minutes of inactivity
listener {
  timeout = 600
  on-timeout = hyprctl dispatch dpms off
  on-resume = hyprctl dispatch dpms on
}

# Lock session after 15 minutes of inactivity
listener {
  timeout = 900
  on-timeout = loginctl lock-session
}

# Suspend system after 20 minutes of inactivity (only when on battery)
listener {
  timeout = 1200
  on-timeout = ~/.local/bin/conditional-suspend.sh
  on-resume = notify-send "System resumed from suspend"
}
